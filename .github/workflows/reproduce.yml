name: Reproduce the release

# Tests the reproducibility claim the resource makes: the corpus archived on
# Zenodo, run through the released quality gate, yields the MANIFEST.csv of the
# release it was archived with.
#
# The comparison is against release-iri/ AT THE RELEASE TAG, not on main. A
# merged harvest pull request adds rows to main before their files reach
# Zenodo with the next version; until then main is ahead of the archive, and
# comparing main with the archive would test nothing but that delay. The pair
# to check -- Zenodo record and release tag -- is read from
# release-iri/archive.json, which publish-release.yml updates with every
# version, so the newest published version is the one checked.
#
#   1. download corpus.zip from Zenodo and check it against Zenodo's MD5
#   2. hashes   every ontology file is byte-identical to the one the gate hashed
#   3. re-gate  run build_manifest.py on the archive and compare every row
#               with the release (path, error_detail and pattern_errors name
#               files by absolute path and are not compared). The rows are
#               gated in the order the release was built: first the ontologies
#               no release-iri/additions/v*.csv lists, then each version's
#               additions against what was already published -- a new copy of a
#               published file is a duplicate of the published row, as
#               merge_harvest.py decided when it added it. A released row the
#               re-run does not reproduce passes only if main's MANIFEST.csv
#               already holds the re-run's values: a correction that the next
#               version publishes (publish-release.yml requires CHANGELOG.md to
#               state it). The job summary lists such rows.
#   4. validate_release.py: views, statistics and manifest agree with the corpus
#
# Ontologies larger than MAX_MB are not re-parsed: noOBO/cco alone is 1.1 GB and
# 15.7 M triples, more memory than a hosted runner has. Step 2 still covers
# them, and the job summary lists them by name. To re-gate everything, run
# the same commands with --max-mb 0 on a machine with well over 16 GB of memory.
#
# A re-harvest is a different question -- it queries live APIs and cannot
# reproduce the corpus. That is harvest.yml.

on:
  workflow_dispatch:
    inputs:
      zenodo_record:
        description: 'Zenodo record holding corpus.zip (empty = the one release-iri/archive.json names)'
        default: ''
      release_tag:
        description: 'Git tag of the release archived in that record (empty = from archive.json)'
        default: ''
      max_mb:
        description: 'Skip re-parsing ontology files larger than this (MB); 0 = no limit'
        default: '100'
  push:
    branches: [main]
    paths:
      - 'pipeline/odpqual/**'
      - 'pipeline/build_manifest.py'
      - 'pipeline/merge_harvest.py'
      - 'pipeline/verify_reproduction.py'
      - 'pipeline/requirements-reproduce.txt'
      - '.github/workflows/reproduce.yml'
  schedule:
    # monthly: catches a changed archive or an unpinned dependency drifting
    - cron: '0 4 15 * *'

permissions:
  contents: read

env:
  MAX_MB: ${{ github.event.inputs.max_mb || '100' }}

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the release tag

      - name: Which version
        env:
          IN_RECORD: ${{ github.event.inputs.zenodo_record }}
          IN_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          rec=${IN_RECORD:-$(python3 -c "import json; print(json.load(open('release-iri/archive.json'))['zenodo_record'])")}
          tag=${IN_TAG:-$(python3 -c "import json; print(json.load(open('release-iri/archive.json'))['release_tag'])")}
          echo "ZENODO_RECORD=$rec" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # The released tables as they were archived; see the header.
      - name: Check out the archived release's tables
        run: |
          mkdir at-tag
          git archive "$RELEASE_TAG" release-iri | tar -x -C at-tag
          echo "RELEASE=$PWD/at-tag/release-iri" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pinned gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements-reproduce.txt

      - name: Download the archived corpus
        run: |
          meta=$(curl -sfL -A "odp-reuse-reproduce" "https://zenodo.org/api/records/$ZENODO_RECORD")
          read -r url md5 < <(python -c '
          import json, sys
          f = next(f for f in json.load(sys.stdin)["files"] if f["key"] == "corpus.zip")
          print(f["links"]["self"], f["checksum"].split(":", 1)[1])' <<<"$meta")
          curl -sfL -A "odp-reuse-reproduce" -o corpus.zip "$url"
          echo "$md5  corpus.zip" | md5sum -c -
          unzip -q corpus.zip -d archive
          test -d archive/corpus/github
          echo "CORPUS=$PWD/archive/corpus" >> "$GITHUB_ENV"
          {
            echo "## Reproducing release $RELEASE_TAG from Zenodo record $ZENODO_RECORD"
            echo "- corpus.zip md5 \`$md5\` verified"
            echo "- re-parse limit: ${MAX_MB} MB"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archived files match the manifest's hashes
        run: |
          python pipeline/verify_reproduction.py hashes \
            --manifest "$RELEASE/MANIFEST.csv" --corpus "$CORPUS" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Re-run the quality gate
        run: |
          # build_manifest.py reads <root>/github_dataset; the release names it github.
          mkdir regate-root
          ln -s "$CORPUS/github" regate-root/github_dataset
          ln -s "$CORPUS/noOBO"  regate-root/noOBO
          ln -s "$CORPUS/OBO"    regate-root/OBO
          python pipeline/build_manifest.py --data-root regate-root --out regate --max-mb "$MAX_MB"

      - name: Re-run matches the released manifest
        run: |
          python pipeline/verify_reproduction.py compare \
            --release "$RELEASE/MANIFEST.csv" --regated regate/MANIFEST.csv \
            --additions "$RELEASE/additions" \
            --corrected release-iri/MANIFEST.csv \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Release is internally consistent
        if: always()
        run: |
          ln -sfn "$CORPUS" "$RELEASE/corpus"
          python "$RELEASE/validate_release.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce-${{ github.run_number }}
          path: |
            regate/MANIFEST.csv
            regate/gate_summary.md
          retention-days: 30
