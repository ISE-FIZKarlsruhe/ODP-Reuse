name: Site

# Builds and deploys the documentation site to GitHub Pages.
#
# Every figure and table is GENERATED from the release artefacts by
# pipeline/gen_site.py, so the published site cannot drift from the data. A
# release therefore republishes correct numbers automatically, and the newest
# version is always what visitors see while the changelog keeps the history.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pipeline/gen_site.py'
      - 'release-iri/views/**'
      - 'release-iri/*.csv'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # gen_site.py reads the tag for the version badge

      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material ontoink

      # The corpus lives on Zenodo, but the 68 reused ODPs are ~1.4 MB and ship
      # with the site so ontoink can render them in-page. They are committed under
      # docs/patterns/, so no download is needed here -- gen_site.py detects the
      # absent corpus and reuses the committed copies rather than re-vendoring.
      - name: Generate pages from the release artefacts
        run: python pipeline/gen_site.py --release release-iri --out docs

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
