name: Quarterly ODP-reuse harvest

# Re-runs discovery, repair, de-duplication and the quality gate on a schedule,
# and opens an issue listing ontology-pattern pairs that did not exist in the
# published release. This is the resource's maintenance loop: it turns the
# dataset from a one-time snapshot into something that keeps measuring.
#
# The claim the paper makes -- that the pipeline is reproducible -- is TESTED by
# this workflow rather than asserted: if the pipeline cannot be re-run from a
# clean checkout on a schedule, the workflow fails and says so publicly.

on:
  schedule:
    # 03:00 UTC on the 1st of Jan / Apr / Jul / Oct
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Discovery sources (comma-separated)'
        default: 'github,google,bioportal,matportal,lov'
      dry_run:
        description: 'Discover and report only; do not commit'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: quarterly-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 720          # discovery is API-rate-limited, not CPU-bound

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r pipeline/requirements.txt

      # ---------------------------------------------------------------- 1. discover
      - name: Discover candidate ontologies
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:     ${{ secrets.GOOGLE_CSE_ID }}
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
          MATPORTAL_API_KEY: ${{ secrets.MATPORTAL_API_KEY }}
        run: |
          cd MultiSource
          # The pattern libraries are third-party and are not redistributed in
          # this repository, so build_github_dataset.py has nothing to match
          # against unless the ODPA repository is cloned first. The finder itself
          # does not need it: with --patterns omitted it auto-discovers the
          # pattern IRIs from odpa/patterns-repository over the API.
          if [ ! -d patterns-repository ]; then
            git clone --depth 1 https://github.com/odpa/patterns-repository.git
          fi
          python odp_multi_source_finder.py \
            --sources "${{ github.event.inputs.sources || 'github,google,bioportal,matportal,lov' }}" \
            --github-max-pages 5 \
            --google-pages 2 \
            --google-skip-on-403 \
            --google-skip-on-429 \
            --out report/
          python build_github_dataset.py \
            --csv report/github.csv \
            --patterns-repo ./patterns-repository \
            --out-dir ../harvest/github_dataset

      # ---------------------------------------------------------------- 2. repair
      # The harvester writes a pattern file even when the fetch returns nothing;
      # 23.1% of files in the 2026 snapshot were zero bytes and were being
      # counted as "no reuse". Repair before gating, never after.
      - name: Repair empty pattern files
        run: |
          cd pipeline
          python repair_patterns.py --data-root ../harvest --out ../harvest/repair
          test "$(find ../harvest -path '*/patterns/*' -size 0 | wc -l)" -eq 0 \
            || { echo "::error::empty pattern files remain after repair"; exit 1; }

      # ---------------------------------------------------------------- 3. gate
      - name: Quality gate
        run: |
          cd pipeline
          python build_manifest.py --data-root ../harvest --out ../harvest/out
          python audit_filters.py --manifest ../harvest/out/MANIFEST.csv \
            --data-root ../harvest --out ../harvest/out/audit --sample 100

      - name: Fail if any removal cannot be re-verified
        run: |
          python - <<'PY'
          import csv, glob, sys
          bad = []
          for f in glob.glob('harvest/out/audit/removed_*.csv'):
              for r in csv.DictReader(open(f, encoding='utf-8')):
                  if r.get('verified') == 'DISPUTED':
                      bad.append((f, r['ontology_id'], r.get('evidence', '')))
          if bad:
              for f, o, e in bad[:20]:
                  print(f"::error file={f}::DISPUTED removal {o}: {e}")
              sys.exit(f"{len(bad)} removals could not be re-verified")
          print("all sampled removals re-verified")
          PY

      # ---------------------------------------------------------------- 4. diff
      - name: Diff against the published release
        id: diff
        run: |
          cd pipeline
          python diff_release.py \
            --old ../release-iri/MANIFEST.csv \
            --new ../harvest/out/MANIFEST.csv \
            --old-pairs ../release-iri/views \
            --new-root ../harvest \
            --out ../harvest/diff

      # ---------------------------------------------------------------- 5. report
      - name: Open an issue when something changed
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('harvest/diff/REPORT.md', 'utf8');
            const title = `Quarterly harvest ${new Date().toISOString().slice(0,10)}: `
                        + `${process.env.NEW_PAIRS} new ontology-pattern pairs`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['harvest', 'data-update'],
            });
        env:
          NEW_PAIRS: ${{ steps.diff.outputs.new_pairs }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ github.run_number }}
          path: |
            harvest/out/MANIFEST.csv
            harvest/out/gate_summary.md
            harvest/out/audit/
            harvest/diff/
            harvest/repair/
          retention-days: 90

      # ---------------------------------------------------------------- 6. propose
      - name: Open a PR with the updated manifest
        if: steps.diff.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: harvest/${{ github.run_number }}
          title: 'Quarterly harvest: update manifest and views'
          body-path: harvest/diff/REPORT.md
          labels: harvest
          add-paths: |
            release-iri/MANIFEST.csv
            release-iri/gate_summary.csv
            release-iri/gate_summary.md
            release-iri/views/**
