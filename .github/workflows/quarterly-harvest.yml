name: Quarterly ODP-reuse harvest

# Re-runs discovery, repair and the quality gate for the GitHub portion of the
# corpus on a schedule, adds the ontologies the release does not have yet, and
# opens a pull request with them. Nothing is ever removed from the release.
#
# What this tests, and what it does not. It tests that the harvester still runs
# end to end from a clean checkout, that its output still passes the gate and
# the removal audit, and what is new on GitHub. It does NOT test that the release
# is reproducible: discovery queries live APIs, so a re-harvest finds a different
# set of files by design. Exact reproducibility of the release -- archived
# corpus in, released MANIFEST.csv out -- is tested by reproduce.yml.
#
# Add, never replace. A harvest is a partial sample: code search returns at most
# 1,000 files per query and ranks them differently on every run. Run 42239149156
# did not return 525 release ontologies, and 88 of 100 sampled were still at the
# same path. So merge_harvest.py keeps every release row as it is and appends
# only ontologies the release does not have, gated against the release.
#
# Three jobs, because GitHub-hosted jobs are capped at 6 h each:
#
#   discover  code search (~80 min for ~150 IRIs at 9 requests/minute) plus the
#             portal searches. The GitHub phase is capped; if the cap is hit,
#             the remaining IRIs are recorded as not_searched, the partial
#             results are uploaded, and the run fails saying so.
#   build     download every hit (~1 s each), repair, gate, audit, diff against
#             the release, then add the new ontologies to a copy of release-iri.
#             Runs only on a complete discovery.
#   propose   on main only: commit that copy to the branch harvest/update and
#             open (or update) a pull request. A person reviews and merges it,
#             then cuts the release; nothing is published automatically.
#
# The discover job hands over its results and the exact ODPA pattern files it
# searched for, so both jobs use the same pattern library.

on:
  schedule:
    # 03:00 UTC on the 1st of Jan / Apr / Jul / Oct
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      sources:
        description: >-
          Discovery sources, comma-separated. GitHub feeds the gate; bioportal,
          matportal and lov go to the discovery report only. Google's Custom
          Search JSON API shuts down on 2027-01-01.
        default: 'github,bioportal,matportal,lov'
      github_max_minutes:
        description: 'Cap on the GitHub search phase (minutes)'
        default: '150'

permissions:
  contents: read

concurrency:
  group: quarterly-harvest
  cancel-in-progress: false

env:
  SOURCES: ${{ github.event.inputs.sources || 'github,bioportal,matportal,lov' }}
  GITHUB_MAX_MINUTES: ${{ github.event.inputs.github_max_minutes || '150' }}

jobs:
  # ==================================================================== discover
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A source whose key is missing is skipped by the finder. Say so where it
      # will be read, rather than letting the run look complete.
      - name: Check credentials
        env:
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
          MATPORTAL_API_KEY: ${{ secrets.MATPORTAL_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          CODE_SEARCH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
        run: |
          {
            echo "## Harvest configuration"
            echo "- sources: \`$SOURCES\`"
            echo "- GitHub search cap: $GITHUB_MAX_MINUTES min"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$CODE_SEARCH_TOKEN" ]]; then
            echo "- code search token: \`CODE_SEARCH_TOKEN\` (personal access token)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::CODE_SEARCH_TOKEN is not set; falling back to GITHUB_TOKEN, which run 42063647084 found throttled from its first code-search request (22 of 150 IRIs in 150 min)."
            echo "- code search token: **GITHUB_TOKEN fallback** (expect heavy throttling)" >> "$GITHUB_STEP_SUMMARY"
          fi
          for pair in bioportal:BIOPORTAL_API_KEY matportal:MATPORTAL_API_KEY google:GOOGLE_API_KEY; do
            src="${pair%%:*}"; var="${pair#*:}"
            if [[ ",$SOURCES," == *",$src,"* && -z "${!var}" ]]; then
              echo "::warning::$src is selected but the $var secret is not set; $src will be skipped."
              echo "- **$src skipped**: secret \`$var\` not set" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ ",$SOURCES," == *",google,"* ]]; then
            echo "::warning::Google's Custom Search JSON API is closed to new customers and shuts down on 2027-01-01."
          fi

      # The search set: the IRIs the release searched, plus any IRI the ODPA
      # repository has gained since, labelled so the report can keep the two apart.
      - name: Build the pattern search set
        run: |
          set -o pipefail
          mkdir -p harvest/report
          cd MultiSource
          git clone --depth 1 https://github.com/odpa/patterns-repository.git
          git -C patterns-repository rev-parse HEAD > ../harvest/report/odpa_commit.txt
          echo "- ODPA patterns-repository: \`$(cat ../harvest/report/odpa_commit.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          python pattern_iris.py sets \
            --release report/retrieved_patterns.csv \
            --repo patterns-repository \
            --out ../harvest/report/pattern_sets.csv 2>&1 \
            | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Discover candidate ontologies
        timeout-minutes: 240
        env:
          # Code search with the Actions GITHUB_TOKEN was throttled from the
          # first request (Retry-After ~12 min after a handful of calls), while
          # a personal token searched all 150 IRIs in 79 min with no back-off. A
          # fine-grained PAT with read-only access to public repositories and
          # no permissions is enough; store it as CODE_SEARCH_TOKEN.
          GITHUB_TOKEN:      ${{ secrets.CODE_SEARCH_TOKEN || secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:     ${{ secrets.GOOGLE_CSE_ID }}
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
          MATPORTAL_API_KEY: ${{ secrets.MATPORTAL_API_KEY }}
        # GitHub serves at most 1,000 results per search (10 pages of 100). The
        # finder used to stop at 250 (5 pages of 50), and 7 queries of run
        # 42239149156 hit that cap with 252 to 9,936 matches on GitHub; 444 of
        # the 525 release ontologies that run did not return were tied to them.
        # A portal that fails 5 IRIs in a row is skipped for the rest of the run.
        run: |
          cd MultiSource
          python odp_multi_source_finder.py \
            --sources "$SOURCES" \
            --patterns-file ../harvest/report/pattern_sets.csv \
            --github-per-page 100 \
            --github-max-pages 10 \
            --github-search-per-minute 9 \
            --portal-max-consecutive-failures 5 \
            --github-max-minutes "$GITHUB_MAX_MINUTES" \
            --google-pages 2 \
            --google-skip-on-403 \
            --google-skip-on-429 \
            --out ../harvest/report/results.csv

      # The build job must copy pattern files from the same ODPA commit the
      # search set came from.
      - name: Stage the pattern library for the build job
        if: always()
        run: |
          mkdir -p odpa
          if [ -d MultiSource/patterns-repository ]; then
            cp -r MultiSource/patterns-repository odpa/
            rm -rf odpa/patterns-repository/.git
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-${{ github.run_number }}
          path: |
            harvest/report/
            odpa/
          retention-days: 90

  # ======================================================================= build
  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      added: ${{ steps.merge.outputs.added }}
      added_kept: ${{ steps.merge.outputs.added_kept }}
      new_pairs: ${{ steps.merge.outputs.new_pairs }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r pipeline/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: discovery-${{ github.run_number }}
          path: .

      - name: Download candidate ontologies
        timeout-minutes: 240
        run: |
          echo "- ODPA patterns-repository: \`$(cat harvest/report/odpa_commit.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          cd MultiSource
          python build_github_dataset.py \
            --csv ../harvest/report/results.csv \
            --patterns-repo ../odpa/patterns-repository \
            --out-dir ../harvest/github_dataset

      # The harvester writes a pattern file even when the fetch returns nothing;
      # 23.1% of files in the 2026 snapshot were zero bytes and were being
      # counted as "no reuse". Repair before gating, never after.
      - name: Repair empty pattern files
        run: |
          cd pipeline
          python repair_patterns.py --data-root ../harvest --out ../harvest/repair
          test "$(find ../harvest -path '*/patterns/*' -size 0 | wc -l)" -eq 0 \
            || { echo "::error::empty pattern files remain after repair"; exit 1; }

      - name: Quality gate
        run: |
          cd pipeline
          python build_manifest.py --data-root ../harvest --out ../harvest/out
          python audit_filters.py --manifest ../harvest/out/MANIFEST.csv \
            --data-root ../harvest --out ../harvest/out/audit --sample 100

      - name: Fail if any re-verified removal is disputed
        run: |
          python - <<'PY'
          import csv, glob, sys
          bad = []
          for f in glob.glob('harvest/out/audit/removed_*.csv'):
              for r in csv.DictReader(open(f, encoding='utf-8')):
                  if r.get('verified') == 'DISPUTED':
                      bad.append((f, r['ontology_id'], r.get('evidence', '')))
          if bad:
              for f, o, e in bad[:20]:
                  print(f"::error file={f}::DISPUTED removal {o}: {e}")
              sys.exit(f"{len(bad)} removals could not be re-verified")
          print("no sampled removal was disputed")
          PY

      # The harvest compared with the release, for the run summary. Release
      # ontologies the harvest did not return are listed as "not returned" and
      # stay in the release.
      - name: Diff against the published release
        id: diff
        run: |
          cd pipeline
          python diff_release.py \
            --old ../release-iri/MANIFEST.csv \
            --new ../harvest/out/MANIFEST.csv \
            --discovery ../harvest/report/results.csv \
            --search-status ../harvest/report/results_github_status.csv \
            --audit ../harvest/out/audit \
            --out ../harvest/diff
          cat ../harvest/diff/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      # Add, never remove. Every release row stays as it is; ontologies the
      # release does not have are gated against it (a new copy of a released
      # file is a duplicate of the released row), their removals re-verified,
      # and appended to MANIFEST.csv, the views and the audit. Fails, writing
      # nothing, if a new removal cannot be re-verified.
      - name: Add the new ontologies to the release
        id: merge
        run: |
          cd pipeline
          python merge_harvest.py \
            --release ../release-iri \
            --harvest-manifest ../harvest/out/MANIFEST.csv \
            --harvest-root ../harvest \
            --additions ../harvest/corpus-additions \
            --report ../harvest/merge \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python write_release_readme.py --release ../release-iri --keep-hashed-note
          python ../release-iri/validate_release.py
          cat ../harvest/merge/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      # New ontologies from a harvest, gate unchanged: a minor version
      # (docs/changelog.md). release.yml checks the tag against CITATION.cff.
      - name: Propose the next minor version
        id: version
        if: steps.merge.outputs.added != '0'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          p = pathlib.Path("CITATION.cff")
          s = p.read_text(encoding="utf-8")
          m = re.search(r'^version:\s*["\']?(\d+)\.(\d+)\.(\d+)["\']?\s*$', s, re.M)
          new = f"{m.group(1)}.{int(m.group(2)) + 1}.0"
          p.write_text(s[:m.start()] + f"version: {new}" + s[m.end():], encoding="utf-8")
          print(f"version={new}")
          PY

      # Uploaded even when an earlier step failed or the job was cancelled, so a
      # partial harvest is still inspectable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ github.run_number }}
          path: |
            harvest/github_dataset/download_log.csv
            harvest/out/MANIFEST.csv
            harvest/out/gate_summary.md
            harvest/out/audit/
            harvest/diff/
            harvest/merge/
            harvest/repair/
          retention-days: 90

      # What the pull request commits: release-iri without the corpus (which
      # is not in git), and the version bump.
      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.added != '0'
        with:
          name: release-update-${{ github.run_number }}
          path: |
            release-iri/
            !release-iri/corpus/
            CITATION.cff
            harvest/merge/REPORT.md
          retention-days: 90

      # The added ontologies' files. The corpus is archived on Zenodo, not in
      # git, so these go into the next Zenodo version by hand (see the PR).
      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.added != '0'
        with:
          name: corpus-additions-${{ github.run_number }}
          path: harvest/corpus-additions/
          retention-days: 90

  # ===================================================================== propose
  # Repository setting required: Settings > Actions > General > Workflow
  # permissions > "Allow GitHub Actions to create and approve pull requests".
  propose:
    needs: build
    if: needs.build.outputs.added != '0' && needs.build.outputs.added != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-update-${{ github.run_number }}
          path: .

      # One standing branch: a later harvest updates the same pull request
      # rather than opening a second one against the same release.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: harvest/update
          base: main
          add-paths: |
            release-iri
            CITATION.cff
          commit-message: >-
            release: add ${{ needs.build.outputs.added }} ontologies from harvest
            run ${{ github.run_id }} (${{ needs.build.outputs.added_kept }} pass the gate)
          title: >-
            v${{ needs.build.outputs.version }}: add ${{ needs.build.outputs.added }} ontologies
            (${{ needs.build.outputs.added_kept }} pass the gate,
            +${{ needs.build.outputs.new_pairs }} pairs)
          body-path: harvest/merge/REPORT.md
          labels: harvest, data-update
          delete-branch: true
